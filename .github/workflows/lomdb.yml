name: Sync LoMDB Data

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: lomdb/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: lomdb

      - name: Download and prepare static tables
        run: node ./lomdb/index.mjs

      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add lomdb
          git diff --cached --quiet || git commit -m "Sync LoMDB data $(date -u +%Y-%m-%d)"
          git push
