<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="X-UA-Compatible"
      content="IE=edge"
    />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1.0"
    />
    <meta
      name="description"
      content="Pomboverso Portfolio"
    />
    <meta
      name="theme-color"
      content="#2e2c42"
    />
    <title>Pomboverso</title>

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="../../img/icon.svg"
    />
    <link
      rel="shortcut icon"
      type="image/x-icon"
      href="../../img/favicon.ico"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../../img/icon_16x16.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="24x24"
      href="../../img/icon_24x24.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../../img/icon_32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="48x48"
      href="../../img/icon_48x48.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="64x64"
      href="../../img/icon_64x64.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="128x128"
      href="../../img/icon_128x128.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="256x256"
      href="../../img/icon_256x256.png"
    />

    <!-- Apple -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../../img/icon_180x180.png"
    />

    <!-- Windows -->
    <meta
      name="msapplication-TileColor"
      content="#2e2c42"
    />
    <meta
      name="msapplication-TileImage"
      content="../../img/icon_128x128.png"
    />

    <!-- Open Graph -->
    <meta
      property="og:image"
      content="../../img/preview.webp"
    />
    <meta
      property="og:image:type"
      content="image/png"
    />
    <meta
      property="og:image:width"
      content="1200"
    />
    <meta
      property="og:image:height"
      content="630"
    />
    <link
      href="css/application.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css?family=Pacifico"
      rel="stylesheet"
    />
  </head>
  <body>
    <aside>
      <a
        id="return"
        href="#"
        ><img
          src="img/return.png"
          alt="return"
      /></a>
    </aside>
    <main>
      <header>
        <h1>Main<em>Front</em></h1>
        <h2 class="bx2">{ Ruler }</h2>
        <h2 class="bx3">[ASCII<em>CODE</em>]</h2>
      </header>
      <section
        id="rulerBox"
        class="bx2"
      >
        <p>{ <em id="ww">800 </em>x <em id="hh">600</em> }px</p>
        <p>[ <em id="aspect">1.1</em> ]</p>
      </section>
      <section
        id="mainBox"
        class="bx1"
      ></section>
      <section
        id="asciiBox"
        class="bx3"
      ></section>
    </main>
    <script
      src="https://code.jquery.com/jquery-1.11.2.min.js"
      type="text/javascript"
    ></script>
    <script
      src="js/all.js"
      type="text/javascript"
    ></script>
    <script
      src="js/mainfrontDB.js"
      type="text/javascript"
    ></script>
    <script
      src="js/mainfront.js"
      type="text/javascript"
    ></script>
  </body>
</html>
