<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="X-UA-Compatible"
      content="IE=edge"
    />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1.0"
    />
    <meta
      name="description"
      content="Pomboverso Portfolio"
    />
    <meta
      name="theme-color"
      content="#2e2c42"
    />
    <title>Pomboverso</title>

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="../../img/icon.svg"
    />
    <link
      rel="shortcut icon"
      type="image/x-icon"
      href="../../img/favicon.ico"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../../img/icon_16x16.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="24x24"
      href="../../img/icon_24x24.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../../img/icon_32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="48x48"
      href="../../img/icon_48x48.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="64x64"
      href="../../img/icon_64x64.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="128x128"
      href="../../img/icon_128x128.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="256x256"
      href="../../img/icon_256x256.png"
    />

    <!-- Apple -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../../img/icon_180x180.png"
    />

    <!-- Windows -->
    <meta
      name="msapplication-TileColor"
      content="#2e2c42"
    />
    <meta
      name="msapplication-TileImage"
      content="../../img/icon_128x128.png"
    />

    <!-- Open Graph -->
    <meta
      property="og:image"
      content="../../img/preview.webp"
    />
    <meta
      property="og:image:type"
      content="image/png"
    />
    <meta
      property="og:image:width"
      content="1200"
    />
    <meta
      property="og:image:height"
      content="630"
    />

    <link
      rel="stylesheet"
      href="css/style.css"
    />
    <style>
      body {
        background-image: linear-gradient(to right, #f55c61, #c84ea4);
      }
    </style>
  </head>

  <body>
    <header>
      <img
        src="images/logo-formability-white.svg"
        alt="Logo Formability"
        width="130"
      />
    </header>

    <div class="grid">
      <div class="column">
        <img
          src="images/toolbox-wood.png"
          width="650"
          class="preview"
          alt="Toolbox"
        />
      </div>
      <div class="column">
        <h1>An error occurred</h1>
        <p>We’ve sent up the signal to our team and we’re on a mission to fix whatever’s broken.</p>
        <a class="btn blue">Return to Dashboard</a>
      </div>
    </div>
  </body>
</html>
