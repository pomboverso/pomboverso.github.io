<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="X-UA-Compatible"
      content="IE=edge"
    />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1.0"
    />
    <meta
      name="description"
      content="Pomboverso Portfolio"
    />
    <meta
      name="theme-color"
      content="#2e2c42"
    />
    <title>Pomboverso</title>

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="../../img/icon.svg"
    />
    <link
      rel="shortcut icon"
      type="image/x-icon"
      href="../../img/favicon.ico"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../../img/icon_16x16.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="24x24"
      href="../../img/icon_24x24.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../../img/icon_32x32.png"

    <link
      rel="icon"
      type="image/png"
      sizes="48x48"
      href="../../img/icon_48x48.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="64x64"
      href="../../img/icon_64x64.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="128x128"
      href="../../img/icon_128x128.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="256x256"
      href="../../img/icon_256x256.png"
    />

    <!-- Apple -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="../../img/icon_180x180.png"
    />

    <!-- Windows -->
    <meta
      name="msapplication-TileColor"
      content="#2e2c42"
    />
    <meta
      name="msapplication-TileImage"
      content="../../img/icon_128x128.png"
    />

    <meta
      property="og:image"
      content="../../img/preview.webp"
    />
    <meta
      property="og:image:type"
      content="image/png"
    />
    <meta
      property="og:image:width"
      content="1200"
    />
    <meta
      property="og:image:height"
      content="630"
    />

    <link
      rel="stylesheet"
      href="css/demo.css"
    />

  <body id="view-demo">
    <section>
      <div class="content">
        <h1>Demo</h1>
        <p>
          <time>May 5, 1990</time>
        </p>
      </div>
      <figure>
        <div class="hq">
          <div class="base">
            <div class="arm">
              <div class="anthena">
                <img
                  alt="Anthena"
                  src="images/popkern/base_anthena.png"
                />
              </div>
              <img
                alt="Robotic Bone"
                src="images/popkern/base_arm.png"
              />
            </div>
            <img
              alt="Formability Headquarters"
              src="images/popkern/base.png"
            />
          </div>
        </div>
      </figure>
      <div class="clouds">
        <div class="cloud c01">
          <img
            src="images/popkern/cloud-1.png"
            alt="Picture of the Cloud in the sky"
          />
        </div>
        <div class="cloud c02">
          <img
            src="images/popkern/cloud-2.png"
            alt="Picture of the Cloud in the sky"
          />
        </div>
        <div class="cloud c03">
          <img
            src="images/popkern/cloud-1.png"
            alt="Picture of the Cloud in the sky"
          />
        </div>
        <div class="cloud c04">
          <img
            src="images/popkern/cloud-2.png"
            alt="Picture of the Cloud in the sky"
          />
        </div>
        <div class="cloud c05">
          <img
            src="images/popkern/cloud-1.png"
            alt="Picture of the Cloud in the sky"
          />
        </div>
        <div class="cloud c06">
          <img
            src="images/popkern/cloud-2.png"
            alt="Picture of the Cloud in the sky"
          />
        </div>
      </div>
